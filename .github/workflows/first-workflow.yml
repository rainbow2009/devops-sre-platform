name: My First CI Workflow

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run Ruff
        run: ruff check .

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Verify dependencies
        run: python -m pip check

      - name: Run pytest
        run: python -m pytest -v

      - name: Show GitHub event context
        run: |
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Ref: $GITHUB_REF"
          echo "SHA: $GITHUB_SHA"
          echo "Branch: $GITHUB_REF_NAME"
  build:
    needs: [lint, test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Show Docker version
        run: docker version

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: security-control-hub:ci
          cache-from: type=gha,scope=security-control-hub
          cache-to: type=gha,scope=security-control-hub,mode=max

      - name: Verify Docker image
        run: docker image inspect security-control-hub:ci
      - name: Smoke test API container
        run: |
          docker run  -d \
            --name sch-ci-smoke \
            -p 127.0.0.1:8001:8000 \
            security-control-hub:ci

          trap 'docker rm -f sch-ci-smoke >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8001/health; then
              echo
              echo "Smoke test passed!"
              exit 0
            fi

            sleep 1
          done

          docker logs sch-ci-smoke
          exit 1

      - name: Save Docker image for Trivy
        run: |
          docker save \
            -o "$RUNNER_TEMP/security-control-hub-ci.tar" \
            security-control-hub:ci

      - name: Generate full Trivy vulnerability report
        run: |
          docker run --rm \
            -v trivy-cache:/root/.cache \
            -v "$RUNNER_TEMP:/scan" \
            aquasec/trivy:0.76.2 \
            image \
            --input /scan/security-control-hub-ci.tar \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --format json \
            --output /scan/trivy-full.json \
            --exit-code 0

      - name: Enforce Trivy security gate
        run: |
          docker run --rm \
            -v trivy-cache:/root/.cache \
            -v "$RUNNER_TEMP:/scan:ro" \
            aquasec/trivy:0.76.2 \
            image \
            --input /scan/security-control-hub-ci.tar \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1

      - name: Upload Trivy vulnerability report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: trivy-full-report
          path: ${{ runner.temp }}/trivy-full.json
          if-no-files-found: warn
          retention-days: 7

  hello:
    needs: [lint, test, build]
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
      - name: Verify required checks
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          echo "Lint result: $LINT_RESULT"
          echo "Test result: $TEST_RESULT"
          echo "Build result: $BUILD_RESULT"

          test "$LINT_RESULT" = "success"
          test "$TEST_RESULT" = "success"
          test "$BUILD_RESULT" = "success"

  system-info:
    needs: hello
    runs-on: ubuntu-latest

    steps:
      - name: Display runner details
        run: |
          echo "Runner: $RUNNER_NAME"
          echo "OS: $RUNNER_OS"
          echo "Job: $GITHUB_JOB"
          echo "Hostname: $(hostname)"

  publish:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: hello
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=security-control-hub
